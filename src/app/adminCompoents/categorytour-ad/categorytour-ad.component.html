<section class="dashboard-section container">
  <h2 class="section-title">All Categories</h2>
  
  <!-- Add Button -->
  <div class="add-tour-wrapper">
    <button class="btn add-tour-btn" [routerLink]="['/admin/catTourCreate']"
    >
      <i class="fa-solid fa-plus"></i>
      Add New Category
    </button>
  </div>

  <!-- Category List -->
  <div class="tour-list">

    <!-- Table Header -->
    <div class="tour-row header">
      <div class="tour-col id">ID</div>
      <div class="tour-col title">Name</div>
      <div class="tour-col status">Status</div>
      <div class="tour-col actions">Actions</div>
    </div>

    @for (tour of paginatedCategories; track tour.id) {
    <div class="tour-row">

      <!-- ID -->
      <div class="tour-col id">
        <span>#{{ tour.id }}</span>
      </div>

      <!-- Title -->
      <div class="tour-col title">
        <h3>{{ tour.slug }}</h3>
      </div>

      <!-- Status -->
      <div class="tour-col status">
        <span class="tour-status" [class.active]="tour.isActive" [class.inactive]="!tour.isActive">
          {{ tour.isActive ? 'Active' : 'Inactive' }}
        </span>
      </div>

      <!-- Actions -->
      <div class="tour-col actions">
        <button class="btn edit-btn" title="Edit" [routerLink]="['/admin/catTourUpdate',tour.id]">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <!-- <button class="btn delete-btn" title="Delete" (click)="deleteCatTour(tour.id)">
          <i class="fa-solid fa-trash"></i>
        </button> -->
      </div>

    </div>
    }
  </div>

  <div class="pagination-wrapper">
    <button
      class="pagination-btn"
      [disabled]="pageIndex === 1"
      (click)="changePage(pageIndex - 1)">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    @for (page of totalPages; track page) {
      <button
        class="pagination-number"
        [class.active-page]="pageIndex === page"
        (click)="changePage(page)">
        {{ page }}
      </button>
    }

    <button
      class="pagination-btn"
      [disabled]="pageIndex >= totalPages.length"
      (click)="changePage(pageIndex + 1)">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

</section>
